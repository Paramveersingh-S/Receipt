[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-shop"
version = "0.1.0"
description = "TipJar Shop - Target demo e-commerce application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
